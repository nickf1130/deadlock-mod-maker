[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlock-sound-studio"
version = "1.0.0"
description = "Authoritative Python backend for Deadlock Mod Maker"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "mutagen>=1.47,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=12.3,<13"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1,<8",
  "pyinstaller>=6.11,<7"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deadlock_sound_studio*"]

[tool.setuptools.package-data]
"deadlock_sound_studio.database" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: opt-in tests for real locally supplied tools"
]

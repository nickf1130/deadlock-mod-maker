name: Windows release checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Use Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Run renderer and Electron unit tests
        run: npm test

      - name: Run Python tests
        run: npm run test:python

      - name: Audit Python dependencies
        run: npm run audit:python

      - name: Run desktop integration tests
        run: npm run test:e2e

      - name: Build and verify portable release
        run: npm run dist

      - name: Upload manually triggered and tagged builds
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: DeadlockModMaker-${{ github.ref_name }}
          path: |
            release/DeadlockModMaker-*-portable.exe
            release/DeadlockModMaker-*-portable.exe.sha256
          if-no-files-found: error
